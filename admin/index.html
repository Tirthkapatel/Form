    async function uploadPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const base64 = reader.result.split(',')[1];
            const data = {
              filename: `Admin_${Date.now()}_${file.name}`,
              mimetype: file.type,
              base64: base64
            };
            const res = await fetch("https://script.google.com/macros/s/AKfycbwecRwOF0Kz1Pm36zexZ2-QFXvMx6cHep1d_KwRM-8pkIPJ6QlWZ23R21kxeokC0TTl6w/exec", {
              method: "POST",
              body: JSON.stringify(data)
            });
            const json = await res.json();
            if (json.success) {
              let finalUrl = json.url;
              const idMatch = finalUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
              if (idMatch && idMatch[1]) finalUrl = `https://drive.google.com/uc?id=${idMatch[1]}`;
              resolve(finalUrl);
            } else {
              reject(new Error(json.error || "Upload failed."));
            }
          } catch (err) {
            reject(new Error("Server error."));
          }
        };
        reader.onerror = () => reject(new Error("File read error."));
        reader.readAsDataURL(file);
      });
    }

                    <div>
                      <label className="block text-[11px] font-bold text-amber-900 mb-0.5">૧લા મિત્રનો મોબાઈલ નં (ઓટો-સર્ચ)</label>
                      <input type="tel" value={memberFormData.friend1Mobile} onChange={(e) => handleFriend1MobileChange(e.target.value)} className="w-full border p-1.5 rounded bg-white font-semibold" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-amber-900 mb-0.5">૧લા મિત્રનું નામ</label>
                      <input type="text" value={memberFormData.friend1Name} onChange={(e) => setMemberFormData({...memberFormData, friend1Name: e.target.value})} className="w-full border p-1.5 rounded bg-white" />
                      {friend1AutoFound && <span className="text-[10px] font-bold text-emerald-700 block mt-0.5">✓ ઓટોમેટિક મળી ગયેલ નામ</span>}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-amber-50/70 p-2.5 rounded border border-amber-200">
                    <div>
                      <label className="block text-[11px] font-bold text-amber-900 mb-0.5">૨જા મિત્રનો મોબાઈલ નં (ઓટો-સર્ચ)</label>
                      <input type="tel" value={memberFormData.friend2Mobile} onChange={(e) => handleFriend2MobileChange(e.target.value)} className="w-full border p-1.5 rounded bg-white font-semibold" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-amber-900 mb-0.5">૨જા મિત્રનું નામ</label>
                      <input type="text" value={memberFormData.friend2Name} onChange={(e) => setMemberFormData({...memberFormData, friend2Name: e.target.value})} className="w-full border p-1.5 rounded bg-white" />
                      {friend2AutoFound && <span className="text-[10px] font-bold text-emerald-700 block mt-0.5">✓ ઓટોમેટિક મળી ગયેલ નામ</span>}
                    </div>
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">હાલના પોષક લીડર</label>
                    <select value={memberFormData.assignedLeaderId || ''} onChange={(e) => setMemberFormData({...memberFormData, assignedLeaderId: e.target.value || null})} className="w-full border p-2 rounded font-bold text-orange-900">
                      <option value="">-- પસંદ કરો (ખબર ના હોય તો ખાલી રાખો) --</option>
                      {leaders.map(l => (
                        <option key={l.id} value={l.id}>{l.name} ({l.area})</option>
                      ))}
                    </select>
                  </div>

                  {currentRole === 'ADMIN' && memberFormData.id && (
                      <div className="pt-2 border-t">
                      <button type="button" onClick={() => { setShowAddMemberModal(false); openAddLeaderModal(memberFormData); }} className="w-full bg-amber-100 text-amber-800 hover:bg-amber-200 px-3 py-2 rounded text-xs font-bold flex items-center justify-center space-x-1">
                        <span>👑</span>
                        <span>આ સભ્યને પોષક લીડર બનાવો</span>
                      </button>
                    </div>
                  )}

                  <div className="pt-3 border-t flex justify-end space-x-2">
                    <button type="button" onClick={() => setShowAddMemberModal(false)} className="px-4 py-2 border rounded text-xs font-bold text-gray-600">રદ કરો</button>
                    <button type="submit" disabled={!!duplicateMobileError} className={`px-5 py-2 rounded text-xs font-bold shadow text-white ${duplicateMobileError ? 'bg-gray-400 cursor-not-allowed' : 'bg-orange-600 hover:bg-orange-700'}`}>
                      ડેટા સેવ કરો
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          {showAssignLeaderModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg max-w-sm w-full p-5 shadow-xl space-y-4">
                <h3 className="font-bold text-base text-gray-900">પોષક લીડરની ફાળવણી કરો</h3>
                <p className="text-xs text-gray-600">સભ્ય <strong>{showAssignLeaderModal.fullName}</strong> ને કયા લીડર નીચે ફાળવવા છે?</p>

                <div className="space-y-2 max-h-60 overflow-y-auto">
                  {leaders.map(l => (
                    <button key={l.id} onClick={() => handleAssignLeader(showAssignLeaderModal.id, l.id)} className="w-full text-left p-2.5 border rounded hover:bg-orange-50 text-xs font-bold flex justify-between items-center">
                      <span>{l.name}</span>
                      <span className="text-gray-500 font-normal">{l.area}</span>
                    </button>
                  ))}
                </div>

                <button onClick={() => setShowAssignLeaderModal(null)} className="w-full text-center text-xs text-gray-500 underline pt-2">રદ કરો</button>
              </div>
            </div>
          )}

          {}
          {showAddTaskModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg max-w-md w-full p-5 shadow-xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-gray-900">નવો ટાસ્ક ઉમેરો</h3>
                  <button onClick={() => setShowAddTaskModal(false)} className="text-gray-400">✕</button>
                </div>
                <form onSubmit={handleAddTask} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold block mb-1">ટાસ્કનું નામ *</label>
                    <input type="text" required value={taskFormData.title} onChange={(e) => setTaskFormData({ ...taskFormData, title: e.target.value })} className="w-full border p-2 rounded" />
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">વિગત</label>
                    <textarea value={taskFormData.description} onChange={(e) => setTaskFormData({ ...taskFormData, description: e.target.value })} className="w-full border p-2 rounded" rows="3"></textarea>
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">અંતિમ તારીખ</label>
                    <input type="date" value={taskFormData.dueDate} onChange={(e) => setTaskFormData({ ...taskFormData, dueDate: e.target.value })} className="w-full border p-2 rounded" />
                  </div>
                  <div className="pt-2 border-t flex justify-end space-x-2">
                    <button type="button" onClick={() => setShowAddTaskModal(false)} className="px-4 py-2 border rounded text-xs font-bold text-gray-600">રદ કરો</button>
                    <button type="submit" disabled={isSavingTask} className="px-5 py-2 rounded text-xs font-bold shadow text-white bg-orange-600 hover:bg-orange-700 disabled:opacity-60">
                      {isSavingTask ? 'સેવ થાય છે...' : 'ટાસ્ક ઉમેરો'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          {showAddPollModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg max-w-md w-full p-5 shadow-xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-gray-900">નવો પોલ ઉમેરો</h3>
                  <button onClick={() => setShowAddPollModal(false)} className="text-gray-400">✕</button>
                </div>
                <form onSubmit={handleAddPollManual} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold block mb-1">પ્રશ્ન *</label>
                    <input type="text" required value={pollFormQuestion} onChange={(e) => setPollFormQuestion(e.target.value)} className="w-full border p-2 rounded" placeholder="દા.ત. આગામી સભાનો સમય?" />
                  </div>
                  <div className="space-y-2">
                    <label className="font-semibold block mb-1">વિકલ્પો * (ઓછામાં ઓછા ૨)</label>
                    {pollFormOptions.map((opt, idx) => (
                      <div key={idx} className="flex items-center space-x-2">
                        <input type="text" value={opt} onChange={(e) => setPollFormOptions(prev => prev.map((o, i) => i === idx ? e.target.value : o))} className="flex-grow border p-2 rounded" placeholder={`વિકલ્પ ${idx + 1}`} />
                        {pollFormOptions.length > 2 && (
                          <button type="button" onClick={() => setPollFormOptions(prev => prev.filter((_, i) => i !== idx))} className="text-rose-600 px-2">✕</button>
                        )}
                      </div>
                    ))}
                    {pollFormOptions.length < 6 && (
                      <button type="button" onClick={() => setPollFormOptions(prev => [...prev, ''])} className="text-orange-600 font-bold text-[11px] hover:underline">+ વિકલ્પ ઉમેરો</button>
                    )}
                  </div>
                  <div className="pt-2 border-t flex justify-end space-x-2">
                    <button type="button" onClick={() => setShowAddPollModal(false)} className="px-4 py-2 border rounded text-xs font-bold text-gray-600">રદ કરો</button>
                    <button type="submit" disabled={isSavingPoll} className="px-5 py-2 rounded text-xs font-bold shadow text-white bg-orange-600 hover:bg-orange-700 disabled:opacity-60">
                      {isSavingPoll ? 'સેવ થાય છે...' : 'પોલ ઉમેરો'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          {showAddLeaderModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg max-w-md w-full p-5 shadow-xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-gray-900">નવો પોષક લીડર ઉમેરો</h3>
                  <button onClick={() => setShowAddLeaderModal(false)} className="text-gray-400">✕</button>
                </div>
                <form onSubmit={handleAddLeader} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold block mb-1">નામ *</label>
                    <input type="text" required value={leaderFormData.name} onChange={(e) => setLeaderFormData({ ...leaderFormData, name: e.target.value })} className="w-full border p-2 rounded" />
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">મોબાઈલ નંબર *</label>
                    <input type="tel" required value={leaderFormData.mobile} onChange={(e) => setLeaderFormData({ ...leaderFormData, mobile: e.target.value })} className="w-full border p-2 rounded" />
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">જન્મ તારીખ</label>
                    <input type="date" value={leaderFormData.birthDate} onChange={(e) => setLeaderFormData({ ...leaderFormData, birthDate: e.target.value })} className="w-full border p-2 rounded" />
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">વિસ્તાર / ઝોન</label>
                    <input type="text" value={leaderFormData.area} onChange={(e) => setLeaderFormData({ ...leaderFormData, area: e.target.value })} className="w-full border p-2 rounded" placeholder="દા.ત. વેસ્ટ ઝોન - સુરત" />
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">આ લીડરનો રોલ પસંદ કરો *</label>
                    <select required value={leaderFormData.role || 'LEADER'} onChange={(e) => setLeaderFormData({ ...leaderFormData, role: e.target.value })} className="w-full border p-2 rounded font-bold text-orange-900 bg-orange-50">
                      <option value="LEADER">પોષક લીડર (Poshak Leader)</option>
                      <option value="ADMIN">સુપર એડમિન (Super Admin)</option>
                    </select>
                    <p className="text-[10px] text-gray-500 mt-1">સુપર એડમિન પાસે બધી સિસ્ટમ જોવાનો અને નવા લીડર ઉમેરવાનો અધિકાર રહેશે.</p>
                  </div>
                  <p className="text-[11px] text-gray-500">લીડર પોતાનો પાસવર્ડ પહેલી વાર login કરે ત્યારે જાતે સેટ કરશે.</p>
                  <div className="pt-2 border-t flex justify-end space-x-2">
                    <button type="button" onClick={() => setShowAddLeaderModal(false)} className="px-4 py-2 border rounded text-xs font-bold text-gray-600">રદ કરો</button>
                    <button type="submit" disabled={isSavingLeader} className="px-5 py-2 rounded text-xs font-bold shadow text-white bg-orange-600 hover:bg-orange-700 disabled:opacity-60">
                      {isSavingLeader ? 'સેવ થાય છે...' : 'લીડર ઉમેરો'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}


          {}
          {showSetPasswordModal && targetLeaderForPass && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl max-w-sm w-full p-5 shadow-2xl space-y-4 border border-orange-200">
                <div className="text-center space-y-1">
                  <div className="w-12 h-12 bg-amber-100 text-amber-700 rounded-full flex items-center justify-center mx-auto text-xl font-bold">🔑</div>
                  <h3 className="font-bold text-base text-gray-900">{targetLeaderForPass.forceChange ? 'પાસવર્ડ બદલવો જરૂરી છે' : 'તમારો પાસવર્ડ સેટ કરો'}</h3>
                  <p className="text-xs text-gray-500">
                    જય સ્વામિનારાયણ <strong>{targetLeaderForPass.name}</strong>!{' '}
                    {targetLeaderForPass.forceChange
                      ? 'સુરક્ષા માટે default પાસવર્ડ (1234) ને બદલે નવો પાસવર્ડ બનાવો:'
                      : 'નવો પાસવર્ડ બનાવો:'}
                  </p>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-gray-700 block mb-1">નવો પાસવર્ડ લખો</label>
                    <input type="password" placeholder="ઓછામાં ઓછો ૩ અક્ષરનો પાસવર્ડ" value={newPassInput} onChange={(e) => setNewPassInput(e.target.value)} className="w-full border rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-orange-500 focus:outline-none" />
                  </div>

                  <button onClick={handleSaveNewPassword} className="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2.5 rounded-lg text-xs shadow">
                    પાસવર્ડ સેવ કરો & લોગીન થાઓ
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
